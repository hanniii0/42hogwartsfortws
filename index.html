<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格華茲：轉校生的起點 - 遊戲大廳</title>
    <style>
        /* 🌌 承襲全案的英倫深夜魔法底色 */
        body {
            background-color: #0b0e14;
            color: #c9d1d9;
            font-family: "Times New Roman", "Georgia", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🎬 遊戲大廳主要容器（古典羊皮紙飾邊美術設計） */
        .lobby-wrapper {
            max-width: 600px;
            width: 100%;
            background-color: #151922;
            border: 1px solid #2a313d;
            border-top: 4px solid #dfcf9f; /* 頂部古典金銅色飾邊 */
            border-bottom: 4px solid #dfcf9f; /* 底部古典金銅色飾邊 */
            border-radius: 12px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(223, 207, 159, 0.05);
            box-sizing: border-box;
            position: relative;
        }

        /* 👑 遊戲主標題美術設計 */
        h1 {
            font-family: "Georgia", serif;
            font-size: 2.4em;
            font-weight: 700;
            color: #dfcf9f; /* 經典金銅色 */
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(223, 207, 159, 0.2);
        }

        .subtitle {
            font-size: 1.05em;
            color: #8b949e;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 45px;
        }

        /* 🪄 裝飾用四大學院圖騰微調留白 */
        .crest-divider {
            color: #2a313d;
            font-size: 1.2em;
            margin: 20px 0;
            letter-spacing: 6px;
        }

        /* 🟢 霍格華茲經典翠綠色：開始遊戲大按鈕 */
        .start-game-btn {
            display: inline-block;
            width: 80%;
            background-color: #0a4d26; /* 經典翠綠墨水 */
            color: #ffffff;
            border: 1px solid #2ea44f;
            border-radius: 4px;
            padding: 16px 30px;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 45px;
            box-shadow: 0 4px 12px rgba(10, 77, 38, 0.3);
            transition: all 0.25s ease;
        }
        .start-game-btn:hover {
            background-color: #116934;
            border-color: #3fb950;
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.5);
            transform: translateY(-2px);
        }

        /* 📊 下方常駐資訊欄（金色與低調灰字） */
        .footer-info {
            border-top: 1px solid #21262d;
            padding-top: 25px;
            font-size: 0.85em;
            color: #8b949e;
            line-height: 1.8;
        }

        .counter-box {
            background-color: #1f242c;
            border: 1px solid #2a313d;
            border-radius: 6px;
            padding: 6px 16px;
            display: inline-block;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .counter-num {
            color: #58a6ff;
            font-weight: bold;
        }

        /* ✍️ 金色小字的二創作者標記 */
        .author-tag {
            color: #dfcf9f; /* 金色小字 */
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="lobby-wrapper">
    
    <h1>Hogwarts School for TWS</h1>
    <div class="subtitle">二創文字網頁遊戲模擬器</div>

    <div class="crest-divider">✦ ✦ ✦ ✦</div>

    <button class="start-game-btn" onclick="enterHogwarts()">[ 開啟入學儀式 ]</button>

    <div class="footer-info">
        
        <div class="counter-box">
            🏰 尋路巫師：第 <span id="visitor-count" class="counter-num">002405</span> 位入校者
        </div>
        
        <div class="copyright">
            &copy; 2026 Hogwarts Online Text Game. All Rights Reserved.<br>
            <small style="color: #6e7681;">本作品僅供同好交流，非商業用途。原作版權歸 J.K. Rowling 與相關官方所有。</small>
        </div>
        
        <div class="author-tag">
            故事二創作者：haniii
        </div>
        
    </div>

</div>

<script>
    // 🖥️ 網頁初始化：處理瀏覽人次的視覺動態感
    document.addEventListener("DOMContentLoaded", function() {
        // 心機設計：從 LocalStorage 讀取或生成一個專屬的校園探索人次
        let currentCount = localStorage.getItem('Hogwarts_Lobby_Counter');
        if (!currentCount) {
            // 如果是第一次打開，生成一個帶有儀式感的隨機幸運開頭數字
            currentCount = Math.floor(Math.random() * (3500 - 2000) + 2000);
        } else {
            // 每次重新整理，模擬真實網站有人陸續進站的動態加人
            currentCount = parseInt(currentCount) + 1;
        }
        localStorage.setItem('Hogwarts_Lobby_Counter', currentCount);
        
        // 格式化輸出（補零成6位數補強網遊硬核感）
        document.getElementById('visitor-count').innerText = String(currentCount).padStart(6, '0');
    });

    // ➔ 跳轉至 1-1 入學通知書 的檔案邏輯
    function enterHogwarts() {
        // 清空之前殘留的靈魂檔案，確保重新開局時數據純淨
        localStorage.clear();
        
        // 正式轉跳至你的 1-1 文本與輸入表單檔案（對接到你 1-1 的 HTML 檔名）
        window.location.href = "chapter1_1.html"; 
    }
</script>

</body>
</html>
