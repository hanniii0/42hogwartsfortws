<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羊皮紙日記 - 巫師靈魂學籍</title>
    <style>
        /* 🎬 完美契合 haniii 導演深夜古典英倫美學 */
        body {
            margin: 0; padding: 0;
            background-color: #0b0e14; color: #cbd5e1;
            font-family: "Georgia", "Times New Roman", serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        .diary-card {
            max-width: 550px; width: 100%;
            background-color: #151922; border: 1px solid #30363d;
            border-radius: 12px; padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
        }
        .diary-title {
            color: #dfcf9f; text-align: center; font-size: 1.6em;
            margin-bottom: 20px; letter-spacing: 2px;
            border-bottom: 1px dashed #8b7355; padding-bottom: 15px;
            text-shadow: 0 0 8px rgba(223, 207, 159, 0.2);
        }
        
        /* 📜 古典羊皮紙裝飾區塊 */
        .section-title {
            font-size: 0.9em; font-weight: bold; color: #dfcf9f;
            margin: 24px 0 12px 0; display: flex; align-items: center;
            letter-spacing: 1px;
        }
        .section-title::after {
            content: ""; flex: 1; margin-left: 10px; border-bottom: 1px solid #21262d;
        }

        /* 📋 基本資料網格 */
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 0.88em; background: #1c212a; padding: 14px; border-radius: 6px; border: 1px solid #2a313d; }
        .profile-item span { color: #8b949e; }
        .profile-item b { color: #f4ecd8; }

        /* 📊 四維核心能力天賦條 */
        .stat-wrapper { margin-bottom: 14px; font-size: 0.85em; }
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .stat-bar-bg { background-color: #21262d; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid #30363d; }
        .stat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* 🪐 六男主純數值乙女排版 */
        .love-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .love-item-pure {
            display: flex; justify-content: space-between; align-items: center;
            background: #11141a; border: 1px solid #21262d; padding: 12px 16px; border-radius: 8px; font-size: 0.9em;
        }
        .love-name-tag { font-weight: bold; }
        .love-value-tag { font-family: "Courier New", monospace; font-weight: bold; letter-spacing: 0.5px; }

        /* 💬 角色互動動態摘要 */
        .summary-box {
            background: #1c212a; border-left: 3px solid #dfcf9f; padding: 14px; font-size: 0.85em; line-height: 1.6;
            color: #8b949e; font-style: italic; border-radius: 0 6px 6px 0; border: 1px solid #2a313d; border-left: none; text-align: justify;
        }

        /* 🔙 返回魔法大廳 */
        .back-btn {
            display: block; width: 100%; text-align: center;
            background-color: #1f242c; color: #dfcf9f; border: 1px solid #8b7355; padding: 14px; margin-top: 28px;
            border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.95em; font-weight: bold; box-sizing: border-box; transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: #262c36; box-shadow: 0 0 12px rgba(139, 115, 85, 0.3); }
    </style>
</head>
<body>

    <div class="diary-card">
        <div class="diary-title">📜 巫師學籍與古靈閣日記</div>

        <div class="section-title">🔮 契約註冊資訊</div>
        <div class="profile-grid">
            <div class="profile-item"><span>巫師全名：</span><b id="p-name">讀取中...</b></div>
            <div class="profile-item"><span>學籍年級：</span><b style="color: #79c0ff;">四年級轉校生</b></div>
            <div class="profile-item"><span>所屬學院：</span><b id="p-house" style="color: #dfcf9f;">未解鎖</b></div>
            <div class="profile-item"><span>靈魂血統：</span><b id="p-blood">未知</b></div>
            <div class="profile-item"><span>契合魔杖：</span><b id="p-wand">未解鎖</b></div>
            <div class="profile-item"><span>隨身錢袋：</span><b id="p-wallet" style="color:#dfcf9f;">0 加隆</b></div>
            <div class="profile-item"><span>古靈閣金庫：</span><b id="p-gringotts" style="color:#dfcf9f;">0 加隆</b></div>
            <div class="profile-item"><span>當前進度：</span><b id="p-progress" style="color:#8b949e;">Chapter 1-1</b></div>
        </div>

        <div class="section-title">📊 四維核心天賦底淵</div>
        <div id="stats-container"></div>

        <div class="section-title">🪐 羈絆少年好感度數據</div>
        <div class="love-grid" id="love-container"></div>

        <div class="section-title">💬 命運之輪：校園互動摘要</div>
        <div class="summary-box" id="summary-content">
            讀取時空記憶中……
        </div>

        <a href="index.html" class="back-btn">[ 闔上日記，返回魔法大廳 ]</a>
    </div>

    <script>
        // 1-2 序章血統天賦基礎加權大帳本字典（20點扎實分起步保底）
        const BLOODLINE_MATRIX = {
            'pure':   { mastery: 25, stamina: 22, wisdom: 22, emotion: 21, bank: 500 },
            'mixed':  { mastery: 23, stamina: 23, wisdom: 23, emotion: 23, bank: 500 },
            'muggle': { mastery: 21, stamina: 24, wisdom: 24, emotion: 24, bank: 1000 }
        };

        window.onload = function() {
            // A. 🧠 提領全域 LocalStorage 數據
            let name = localStorage.getItem('Hogwarts_PlayerName') || "（尚未於1-1落筆）";
            let progress = localStorage.getItem('Hogwarts_Progress') || "1-1";
            let blood = localStorage.getItem('Hogwarts_Bloodline') || "";
            let wallet = localStorage.getItem('Hogwarts_Wallet') || "60";
            
            // 💥 學院動態判定核心：
            // 未來你在 1-6 寫分院儀式結尾時，請順手跑一行：localStorage.setItem('Hogwarts_House', 'Gryffindor'); (以此類推)
            let house = localStorage.getItem('Hogwarts_House') || "";
            let houseDisplay = "⏳ 尚未分院 (1-6儀式解鎖)";
            
            if (house === "Gryffindor") houseDisplay = "🦁 葛萊分多";
            if (house === "Slytherin")  houseDisplay = "🐍 史萊哲林";
            if (house === "Ravenclaw")  houseDisplay = "🦅 雷文克勞";
            if (house === "Hufflepuff") houseDisplay = "🦡 赫夫帕夫";

            // 金庫資產抓取
            let gringotts = localStorage.getItem('Hogwarts_Gringotts') || localStorage.getItem('Hogwarts_Bank');
            if (!gringotts || gringotts === "0") {
                if (BLOODLINE_MATRIX[blood]) {
                    gringotts = BLOODLINE_MATRIX[blood].bank;
                } else {
                    gringotts = "0"; 
                }
            }
            
            // 讀取魔杖採購資料
            let wandWood = localStorage.getItem('Hogwarts_Wand_Wood');
            let wandCore = localStorage.getItem('Hogwarts_Wand_Core');
            let wandText = wandWood ? (wandWood + "木、" + wandCore + "心") : "尚未置辦（未解鎖1-3）";

            // 血統翻譯標籤
            let bloodDisplay = "未解鎖";
            if(blood === "純血") bloodDisplay = "💎 傳承純血背景";
            if(blood === "混血") bloodDisplay = "⏳ 自由混血背景";
            if(blood === "麻瓜") bloodDisplay = "🔌 麻瓜出身背景";

            // 寫入 UI 基本資料
            document.getElementById('p-name').innerText = name;
            document.getElementById('p-progress').innerText = `Chapter ${progress}`;
            document.getElementById('p-blood').innerText = bloodDisplay;
            document.getElementById('p-wand').innerText = wandText;
            document.getElementById('p-wallet').innerText = `${wallet} 加隆`;
            document.getElementById('p-gringotts').innerText = `${gringotts} 加隆`;
            document.getElementById('p-house').innerText = houseDisplay; // 寫入動態分院結果

            // B. 📊 四維天賦能量條：中英雙棲相容攔截防線
            const statsConfig = [
                { chKey: "熟練", enKey: "Mastery", matrixKey: "mastery", name: "✨ 魔咒熟練度", color: "#79c0ff" },
                { chKey: "體力", enKey: "Stamina", matrixKey: "stamina", name: "💪 巫師體力分值", color: "#ff7b72" },
                { chKey: "智慧", enKey: "Wisdom",  matrixKey: "wisdom",  name: "🧠 魔法智慧底蘊", color: "#d2a8ff" },
                { key: "情感", chKey: "情感", enKey: "Emotion", matrixKey: "emotion", name: "🌿 靈魂情感共鳴", color: "#7ee787" }
            ];
            
            let statsHtml = "";
            statsConfig.forEach(s => {
                let val = localStorage.getItem(`Hogwarts_Stat_${s.chKey}`) || localStorage.getItem(`Hogwarts_Stat_${s.enKey}`);
                
                // 動態連動防線
                if (val === null || val === undefined) {
                    if (BLOODLINE_MATRIX[blood]) {
                        val = BLOODLINE_MATRIX[blood][s.matrixKey]; 
                    } else {
                        val = 20; 
                    }
                } else {
                    val = parseInt(val); 
                }

                let percent = Math.min((val / 100) * 100, 100); 
                statsHtml += `
                    <div class="stat-wrapper">
                        <div class="stat-header"><span>${s.name}</span><b style="color:${s.color}">${val} Pts</b></div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${percent}%; background-color:${s.color};"></div></div>
                    </div>`;
            });
            document.getElementById('stats-container').innerHTML = statsHtml;

            // C. 🪐 六男主角純數值好感板
            const boys = [
                { key: "SHINYU",   name: "申惟 (SHINYU)",   house: "赫夫帕夫 🦡", color: "#dfcf9f" },
                { key: "DOHOON",   name: "金道勳 (DOHOON)", house: "葛萊分多 🦁", color: "#ff7b72" },
                { key: "YOUNGJAE", name: "崔英宰 (YOUNGJAE)",house: "雷文克勞 🦅", color: "#79c0ff" },
                { key: "HANJIN",   name: "韓振 (HANJIN)",   house: "史萊哲林 🐍", color: "#7ee787" },
                { key: "JIHOON",   name: "韓志薰 (JIHOON)", house: "葛萊分多 🦁", color: "#e3b341" },
                { key: "KYUNGMIN", name: "李炅潣 (KYUNGMIN)",house: "雷文克勞 🦅", color: "#bc85e6" }
            ];
            
            let loveHtml = "";
            boys.forEach(b => {
                let favorVal = parseInt(localStorage.getItem(`Hogwarts_Love_${b.key}`)) || 0;
                
                if (favorVal === 0) {
                    let shortName = b.name.split(" ")[0]; 
                    favorVal = parseInt(localStorage.getItem(`Hogwarts_Love_${shortName}`)) || 0;
                }

                loveHtml += `
                    <div class="love-item-pure">
                        <div>
                            <span class="love-name-tag" style="color: ${b.color};">${b.name}</span>
                            <span style="font-size:0.78em; color:#8b949e; margin-left:8px;">[${b.house}]</span>
                        </div>
                        <div class="love-value-tag" style="color: ${b.color};">${favorVal} <span style="font-size:0.85em; color:#8b949e;">Favor Pts</span></div>
                    </div>`;
            });
            document.getElementById('love-container').innerHTML = loveHtml;

            // D. 動態時空歷史評語
            let summaryNode = document.getElementById('summary-content');
            if (progress === "1-1") {
                summaryNode.innerHTML = "「午後的蟬鳴黏稠沉悶，貓頭鷹銜來了米奈娃·麥校長的錄取通知信。這本屬於四年級轉校生的日記，墨水才剛剛暈開……」";
            } else if (progress === "1-2" || progress === "1-3") {
                let bloodComment = (blood === "純血") ? "在斜角巷破舊的磚牆前，你古老純血家族的魔力氣場引起了海格的注意。" : "身為毫無魔法背景的麻瓜出身巫師，斜角巷鋪天蓋地的飛路粉與咒語讓你大受震撼。";
                summaryNode.innerHTML = `「你已經跨越了命運的分水嶺。${bloodComment} 手裡攥著剩餘的 ${wallet} 加隆，正在奧利凡德先生的注視下聆聽專屬魔杖與靈魂的磨合。」`;
            } else {
                if (house) {
                    summaryNode.innerHTML = `「時空齒輪已推進至 Chapter ${progress}。分院帽的呢喃猶在耳畔，你已正式歸入大廳。與六位巫師少年的宿命正在城堡走廊中激盪……」`;
                } else {
                    summaryNode.innerHTML = `「時空齒輪已推進至 Chapter ${progress}。你與六位巫師少年的羈絆正在悄然而至……」`;
                }
            }
        };
    </script>
</body>
</html>
